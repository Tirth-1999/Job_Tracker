<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Tracker</title>
    <link rel="stylesheet" href="./styles.css?v=3.6.0" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Job Tracker</h1>
        <p id="syncStatus">Loading applications...</p>
      </div>
      <div class="toolbar">
        <input id="searchInput" type="search" placeholder="Search company, role, subject" />
        <button id="refreshButton" type="button">Refresh</button>
        <button id="exportButton" class="btn-export" type="button" title="Download all applications into Excel / CSV spreadsheet">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          Export to Excel
        </button>
      </div>
    </header>

    <main>
      <section class="stats" id="stats"></section>

      <nav class="tabs" aria-label="Views">
        <button class="tab active" type="button" data-view="board">Board</button>
        <button class="tab" type="button" data-view="companies">Companies</button>
        <button class="tab" type="button" data-view="applications">Applications</button>
        <button class="tab tab-starred" type="button" data-view="starred">Starred <span id="starredCountBadge" class="tab-badge" style="display:none;">0</span></button>
        <button class="tab" type="button" data-view="otherEmails">Other Emails</button>
        <button class="tab tab-followup" type="button" data-view="followup">Follow-Up Needed</button>
        <button class="tab" type="button" data-view="analytics">Analytics</button>
        <button class="tab" type="button" data-view="services">Services</button>
      </nav>

      <section id="boardView" class="view active">
        <div id="boardToolbar" class="board-toolbar">
          <div class="board-toolbar-left">
            <span class="board-filter-label">Filter by Date:</span>
            <div class="board-time-pills" role="group" aria-label="Filter applications by time">
              <button type="button" class="board-time-pill active" data-time="all">All Time</button>
              <button type="button" class="board-time-pill" data-time="7d">Past 7 Days</button>
              <button type="button" class="board-time-pill" data-time="30d">Past 30 Days</button>
              <button type="button" class="board-time-pill" data-time="90d">Past 90 Days</button>
            </div>
          </div>
          <div class="board-toolbar-right">
            <div class="board-density-toggle" role="group" aria-label="Card view density">
              <button type="button" id="btnDensityDetailed" class="btn-density active" data-density="detailed" title="Detailed card view">Detailed</button>
              <button type="button" id="btnDensityCompact" class="btn-density" data-density="compact" title="Compact card view">Compact</button>
            </div>
            <label for="boardSortSelect" class="board-sort-label">Sort Board:</label>
            <select id="boardSortSelect" class="board-sort-select" aria-label="Sort board cards">
              <option value="date_desc">Newest Activity First</option>
              <option value="date_asc">Oldest Activity First</option>
              <option value="company_asc">Company (A to Z)</option>
              <option value="company_desc">Company (Z to A)</option>
            </select>
          </div>
        </div>
        <div id="board" class="board"></div>
      </section>

      <section id="companiesView" class="view">
        <div id="companies" class="table-shell"></div>
      </section>

      <section id="applicationsView" class="view">
        <div id="applications" class="table-shell"></div>
      </section>

      <section id="starredView" class="view">
        <div id="starred" class="starred-shell"></div>
      </section>

      <section id="otherEmailsView" class="view">
        <div id="otherEmails" class="table-shell"></div>
      </section>

      <section id="followupView" class="view">
        <div id="followup" class="followup-shell"></div>
      </section>

      <section id="analyticsView" class="view">
        <div id="analytics" class="analytics-shell"></div>
      </section>

      <section id="servicesView" class="view">
        <div id="services" class="services-shell"></div>
      </section>
    </main>

    <!-- Custom Confirmation Modal Dialog -->
    <div id="confirmModalBackdrop" class="modal-backdrop">
      <div class="modal-box">
        <div class="modal-header">
          <div class="modal-header-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          </div>
          <h3 id="modalTitle">Confirm Pipeline Move</h3>
        </div>
        <div class="modal-body" id="modalBody">
          <!-- Populated dynamically -->
        </div>
        <div class="modal-actions">
          <button id="btnModalCancel" class="btn-modal-cancel" type="button">Cancel</button>
          <button id="btnModalConfirm" class="btn-modal-confirm" type="button">Confirm &amp; Move</button>
        </div>
      </div>
    </div>

    <!-- Follow-Up Draft Review Modal Dialog -->
    <div id="followupModalBackdrop" class="modal-backdrop">
      <div class="modal-box followup-modal-box" id="followupModalBox">
        <!-- Populated dynamically -->
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./app.js?v=3.6.0" type="module"></script>
  </body>
</html>
