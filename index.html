<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Tracker</title>
    <link rel="stylesheet" href="./styles.css?v=2.0.0" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Job Tracker</h1>
        <p id="syncStatus">Loading applications...</p>
      </div>
      <div class="toolbar">
        <input id="searchInput" type="search" placeholder="Search company, role, subject" />
        <button id="refreshButton" type="button">Refresh</button>
        <button id="exportButton" class="btn-export" type="button" title="Download all applications into Excel / CSV spreadsheet">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          Export to Excel
        </button>
      </div>
    </header>

    <main>
      <section class="stats" id="stats"></section>

      <nav class="tabs" aria-label="Views">
        <button class="tab active" type="button" data-view="board">Board</button>
        <button class="tab" type="button" data-view="companies">Companies</button>
        <button class="tab" type="button" data-view="applications">Applications</button>
        <button class="tab" type="button" data-view="otherEmails">Other Emails</button>
        <button class="tab" type="button" data-view="analytics">📊 Analytics</button>
        <button class="tab" type="button" data-view="services">⚙️ Services</button>
      </nav>

      <section id="boardView" class="view active">
        <div id="board" class="board"></div>
      </section>

      <section id="companiesView" class="view">
        <div id="companies" class="table-shell"></div>
      </section>

      <section id="applicationsView" class="view">
        <div id="applications" class="table-shell"></div>
      </section>

      <section id="otherEmailsView" class="view">
        <div id="otherEmails" class="table-shell"></div>
      </section>

      <section id="analyticsView" class="view">
        <div id="analytics" class="analytics-shell"></div>
      </section>

      <section id="servicesView" class="view">
        <div id="services" class="services-shell"></div>
      </section>
    </main>

    <!-- Custom Confirmation Modal Dialog -->
    <div id="confirmModalBackdrop" class="modal-backdrop">
      <div class="modal-box">
        <div class="modal-header">
          <div class="modal-header-icon">🔄</div>
          <h3 id="modalTitle">Confirm Pipeline Move</h3>
        </div>
        <div class="modal-body" id="modalBody">
          <!-- Populated dynamically -->
        </div>
        <div class="modal-actions">
          <button id="btnModalCancel" class="btn-modal-cancel" type="button">Cancel</button>
          <button id="btnModalConfirm" class="btn-modal-confirm" type="button">Confirm & Move</button>
        </div>
      </div>
    </div>

    <script src="./app.js?v=2.2.0" type="module"></script>
  </body>
</html>
