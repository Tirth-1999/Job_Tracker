name: Gmail Sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Backfill older Gmail messages"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      reset_data:
        description: "Replace data/applications.json from scratch"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      max_pages:
        description: "Number of Gmail result pages to scan"
        required: false
        default: "20"
      query:
        description: "Optional Gmail search query override"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: gmail-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync Gmail
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/free' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GMAIL_BACKFILL: ${{ github.event.inputs.backfill || 'false' }}
          GMAIL_RESET_DATA: ${{ github.event.inputs.reset_data || 'false' }}
          GMAIL_MAX_PAGES: ${{ github.event.inputs.max_pages || '' }}
          GMAIL_QUERY: ${{ github.event.inputs.query || vars.GMAIL_QUERY }}
        run: node scripts/sync-gmail.mjs

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/applications.json; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/applications.json
          git commit -m "Update job applications from Gmail"
          git push
