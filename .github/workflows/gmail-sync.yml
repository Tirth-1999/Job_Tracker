name: Gmail Sync

on:
  schedule:
    - cron: "*/30 * * * *"      # main Gmail sync every 30 min
    - cron: "0 10 * * *"         # follow-up scanner once daily at 10am UTC
  workflow_dispatch:
    inputs:
      backfill:
        description: "Backfill older Gmail messages"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      reset_data:
        description: "Replace data/applications.json from scratch"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      max_pages:
        description: "Number of Gmail result pages to scan"
        required: false
        default: "20"
      query:
        description: "Optional Gmail search query override"
        required: false
        default: ""
      run_followup:
        description: "Run the follow-up scanner"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: gmail-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync Gmail
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'google/gemini-3.7-flash' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GMAIL_BACKFILL: ${{ github.event.inputs.backfill || 'false' }}
          GMAIL_RESET_DATA: ${{ github.event.inputs.reset_data || 'false' }}
          GMAIL_MAX_PAGES: ${{ github.event.inputs.max_pages || '' }}
          GMAIL_QUERY: ${{ github.event.inputs.query || vars.GMAIL_QUERY }}
        run: node scripts/sync-gmail.mjs

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/applications.json; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/applications.json
          git commit -m "Update job applications from Gmail"
          git pull --rebase origin main
          git push

      - name: Scan Follow-Up Candidates
        # Run on daily cron trigger OR when manually requested
        if: github.event.schedule == '0 10 * * *' || github.event.inputs.run_followup == 'true'
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'google/gemini-3.7-flash' }}
        run: node scripts/scan-followups.mjs
